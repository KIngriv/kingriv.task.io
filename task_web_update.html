<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Планировщик задач 📈</title>
    <style>
      :root {
        --primary: #3b82f6;
        --bg: #f3f4f6;
        --card: #ffffff;
        --danger: #8A2BE2;
        --success: #10b981;
      }
      body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        padding: 20px;
        margin: 0;
       
        background-repeat: no-repeat;
        background-size: cover;     
        background-position: center;
        background-attachment: fixed;
      }
      .container {
        background: rgba(255, 255, 255, 0.50);
        padding: 2rem;
        margin-top: 60px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 960px;
      
      }
      h1 {
        text-align: center;
        color: #1f2937;
        margin-bottom: 1.5rem;
      }

      /* Форма: адаптированная сетка */
      .add-form {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 14px;
        margin-bottom: 2rem;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
        align-items: end;
      }
      .form-group {
        display: flex;
        flex-direction: column;
      }
      .form-group label {
        font-size: 0.85rem;
        color: #6b7280;
        margin-bottom: 4px;
        width: 100%;
        text-align: center;
      }
      input[type="text"],
      select,
      input[type="datetime-local"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      input[type="file"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.85rem;
        background: #fff;
        cursor: pointer;
        box-sizing: border-box;
      }
      button.action-btn {
        grid-column: span 1;
        padding: 12px;
        background: var(--danger);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.95rem;
        transition: background 0.2s;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button.action-btn:hover { background: #6d1bb5; }

      /* Фильтры */
      .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .filter-btn {
        padding: 8px 16px;
        border: 1px solid #ddd;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .filter-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      /* Прогресс по центру */
      .progress-container {
        margin-bottom: 1.5rem;
        padding: 0.5px;
        background: rgba(255, 255, 255, 0.50);
        border-radius: 8px;
        text-align: center;
      }
      .progress-bar {
        height: 12px;
        background: var(--success);
        border-radius: 6px;
        width: 0%;
        transition: width 0.3s ease;
        margin: 8px auto 0 auto;
      }
      .progress-text {
        font-size: 0.9rem;
        color: #6b7280;
        margin-top: 6px;
      }

      /* Список задач */
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: grid;
        /* Колонки: чекбокс | Задача | Важность | Срок | Примечание | Файл | Удалить */
        grid-template-columns: 40px 2fr 100px 140px 150px 80px 40px;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid #eee;
      }
      @media (max-width: 900px) {
        li { grid-template-columns: 40px 1.5fr 90px 130px 0px 0px 40px; }
        .note-cell, .file-cell { display: none; }
      }

      .checkbox-custom {
        width: 20px;
        height: 20px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .task-text { font-size: 1rem; color: #374151; }
      .completed .task-text { text-decoration: line-through; color: #9ca3af; }

      /* Бейджи важности */
      .badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: bold;
        color: white;
        text-align: center;
      }
      .badge-urgent { background: red; }
      .badge-important { background: #edf75a}
      .badge-normal { background: green; }
      .badge-low { background: grey; }

      .due-date, .note-cell, .file-cell {
        font-size: 0.85rem;
        text-align: center;
      }
      .overdue { color: #dc2626; font-weight: bold; }

      .file-btn {
        background: #e0e7ff;
        color: #3730a3;
        border: 1px solid #c7d2fe;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 0.8rem;
        cursor: pointer;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .file-btn:hover {
        background: #c7d2fe;
      }

      .delete-btn {
        color: red;
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s, background 0.2s;
      }
      li:hover .delete-btn { opacity: 1; }
      li:hover .delete-btn:hover { background: red; color: white; }

     .footer-author {text-align: right}
     .footer-author>button {
      font-size: 1em;
      border: 2px solid white;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      margin-top: 10px;
     }

     .footer-author>button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
     }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📗Планировщик задач🕑</h1>

      <!-- Форма добавления задачи -->
      <div class="add-form">
        <div class="form-group" style="grid-column: span 2;">
          <label>Задача</label>
          <input type="text" id="taskInput" placeholder="Введите свою задачу">
        </div>
        <div class="form-group">
          <label>Важность</label>
          <select id="priorityInput">
            <option value="urgent">Срочно</option>
            <option value="important">Важно</option>
            <option value="normal" selected>Обычное</option>
            <option value="low">Не важно</option>
          </select>
        </div>
        <div class="form-group">
          <label>Срок</label>
          <input type="datetime-local" id="dueDateInput">
        </div>
        
        <div class="form-group">
          <label>Примечание</label>
          <input type="text" id="noteInput" placeholder="Статус задачи">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Файл (макс. 5 МБ)</label>
          <input type="file" id="fileInput">
        </div>
        <button class="action-btn" onclick="addTask()">+ Добавить</button>
      </div>

      <!-- Фильтры -->
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('urgent')">Только срочные</button>
        <button class="filter-btn" onclick="setFilter('overdue')">Просроченные</button>
        <button class="filter-btn" onclick="setFilter('uncompleted')">Активные</button>
      </div>

      <!-- Прогресс -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0% выполнено</div>
      </div>

      <ul id="tasksList">
        <!-- Задачи появятся здесь -->
      </ul>
     <footer class="footer-author">
         <button onclick="changeTheme()">🎨 Сменить тему</button>
    </footer>
    </div>
     
    <script>
      const tasksList = document.getElementById('tasksList');
      const taskInput = document.getElementById('taskInput');
      const priorityInput = document.getElementById('priorityInput');
      const dueDateInput = document.getElementById('dueDateInput');
      const noteInput = document.getElementById('noteInput');
      const fileInput = document.getElementById('fileInput');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      let tasks = JSON.parse(localStorage.getItem('dailyTasksSimple')) || [];
      let currentFilter = 'all';

      // Дата по умолчанию: сегодня + 2 дня
      const now = new Date();
      const defaultDueDate = new Date(now.getTime()+ 2 * 24 * 60 * 60 * 1000);
      defaultDueDate.setSeconds(0, 0);
      dueDateInput.value = defaultDueDate.toISOString().slice(0, 16);

      // --- IndexedDB для хранения файлов (обходит лимиты localStorage) ---
      const DB_NAME = 'TaskPlannerFilesDB';
      const DB_VERSION = 1;
      let db;

      async function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject('Ошибка открытия БД');
          request.onsuccess = () => {
            db = request.result;
            resolve(db);
          };
          request.onupgradeneeded = (event) => {
            const database = event.target.result;
            if (!database.objectStoreNames.contains('files')) {
              database.createObjectStore('files', { keyPath: 'taskId' });
            }
          };
        });
      }

      async function saveFileToDB(taskId, file) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(['files'], 'readwrite');
          const store = transaction.objectStore('files');
          const request = store.put({ taskId: taskId, file: file });
          request.onsuccess = () => resolve();
          request.onerror = () => reject('Ошибка сохранения файла');
        });
      }

      async function getFileFromDB(taskId) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(['files'], 'readonly');
          const store = transaction.objectStore('files');
          const request = store.get(taskId);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject('Ошибка получения файла');
        });
      }

      async function deleteFileFromDB(taskId) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(['files'], 'readwrite');
          const store = transaction.objectStore('files');
          const request = store.delete(taskId);
          request.onsuccess = () => resolve();
          request.onerror = () => reject('Ошибка удаления файла');
        });
      }

      // --- Основная логика приложения ---

      async function addTask() {
        const text = taskInput.value.trim();
        if (!text) {
          alert('Пожалуйста, напишите текст задачи.');
          return;
        }
        
        const file = fileInput.files[0];
        if (file && file.size > 5 * 1024 * 1024) {
          alert('Файл слишком большой! Максимальный размер: 5 МБ.');
          return;
        }

        const newTask = {
          id: Date.now(),
          text: text,
          completed: false,
          priority: priorityInput.value,
          dueDate: dueDateInput.value || null,
          note: noteInput.value.trim(),
          hasFile: !!file,
          fileName: file ? file.name : null
        };

        tasks.push(newTask);
        
        if (file) {
          try {
            await saveFileToDB(newTask.id, file);
          } catch (e) {
            console.error(e);
            alert('Не удалось сохранить файл. Возможно, превышен лимит хранилища браузера.');
            tasks.pop(); // Отменяем добавление задачи, если файл не сохранился
            return;
          }
        }

        saveAndRender();
        taskInput.value = '';
        noteInput.value = '';
        fileInput.value = ''; // Сброс поля файла
      }

      function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.completed = !task.completed;
          saveAndRender();
        }
      }

      async function deleteTask(id) {
        if(!confirm('Удалить эту задачу?')) return;
        
        const task = tasks.find(t => t.id === id);
        if (task && task.hasFile) {
          try {
            await deleteFileFromDB(id);
          } catch (e) {
            console.error('Ошибка удаления файла из БД', e);
          }
        }
        
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
      }

      function setFilter(filter) {
        currentFilter = filter;
        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderTasks();
      }

      function saveAndRender() {
        localStorage.setItem('dailyTasksSimple', JSON.stringify(tasks));
        renderTasks();
      }

      function renderTasks() {
        tasksList.innerHTML = '';

        const filteredTasks = tasks.filter(task => {
          const now = new Date();
          const due = task.dueDate ? new Date(task.dueDate) : null;

          if (currentFilter === 'urgent') return task.priority === 'urgent' && !task.completed;
          if (currentFilter === 'overdue') {
            if (task.completed) return false;
            return due && due < now;
          }
          if (currentFilter === 'uncompleted') return !task.completed;
          return true;
        });

        filteredTasks.sort((a, b) => {
          const priorityOrder = { urgent: 0, important: 1, normal: 2, low: 3 };
          if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          const dateA = a.dueDate ? new Date(a.dueDate) : new Date('9999-12-31');
          const dateB = b.dueDate ? new Date(b.dueDate) : new Date('9999-12-31');
          return dateA - dateB;
        });

        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        progressBar.style.width = percent + '%';
        progressText.textContent = `${percent}% выполнено`;

        filteredTasks.forEach(task => {
          const li = document.createElement('li');

          let priorityClass = 'badge-normal';
          if (task.priority === 'urgent') priorityClass = 'badge-urgent';
          else if (task.priority === 'important') priorityClass = 'badge-important';
          else if (task.priority === 'low') priorityClass = 'badge-low';

          const now = new Date();
          const dueObj = task.dueDate ? new Date(task.dueDate) : null;
          const isOverdue = dueObj && !task.completed && dueObj < now;

          const fileHtml = task.hasFile 
            ? `<button class="file-btn" onclick="downloadFile(${task.id})" title="Скачать/Открыть: ${escapeHtml(task.fileName || 'Файл')}">📎 Файл</button>`
            : `<span style="color:#d1d5db; font-size:0.85rem;">—</span>`;

          li.innerHTML = `
            <input type="checkbox" class="checkbox-custom" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})">
            <span class="task-text">${escapeHtml(task.text)}</span>
            <span class="badge ${priorityClass}">${getPriorityLabel(task.priority)}</span>
            <div class="due-date ${isOverdue ? 'overdue' : ''}">
              ${task.dueDate
                ? formatDate(task.dueDate)
                : '<span style="color:#9ca3af">Без срока</span>'}
            </div>
            <div class="note-cell">${task.note ? escapeHtml(task.note) : '<span style="color:#d1d5db">—</span>'}</div>
            <div class="file-cell">${fileHtml}</div>
            <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
          `;
          tasksList.appendChild(li);
        });
      }

      async function downloadFile(taskId) {
        try {
          const record = await getFileFromDB(taskId);
          if (record && record.file) {
            const task = tasks.find(t => t.id === taskId);
            const fileName = task ? task.fileName : 'download';
            const url = URL.createObjectURL(record.file);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Освобождаем память
          } else {
            alert('Файл не найден или был удален.');
          }
        } catch (e) {
          console.error(e);
          alert('Ошибка при получении файла.');
        }
      }

      function getPriorityLabel(value) {
        switch(value) {
          case 'urgent': return 'Срочно';
          case 'important': return 'Важно';
          case 'normal': return 'Обычное';
          case 'low': return 'Не важно';
          default: return 'Обычное';
        }
      }

      function formatDate(dateString) {
        const d = new Date(dateString);
        return d.toLocaleString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Инициализация при загрузке страницы
      initDB().then(() => {
        renderTasks();
      }).catch(err => {
        console.error(err);
        alert('Ошибка инициализации базы данных. Файлы не будут сохраняться, но задачи будут работать.');
        renderTasks();
      });

      const themes = [
          'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
          'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
          'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
          'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
          'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
      ];
      
      let themeIndex = parseInt(localStorage.getItem('savedThemeIndex')) || 0;
      
      document.body.style.backgroundImage = themes[themeIndex];

      function changeTheme() {
          themeIndex = (themeIndex + 1) % themes.length;
          document.body.style.backgroundImage = themes[themeIndex];
          localStorage.setItem('savedThemeIndex', themeIndex);
      }
    </script>
  </body>
</html>
