<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>📗Планировщик задач🕑</h1>

        <!-- Форма добавления задачи -->
        <div class="add-form">
            <div class="form-group" style="grid-column: span 2;">
                <label>Задача</label>
                <input type="text" id="taskInput" placeholder="Введите свою задачу">
            </div>
            <div class="form-group">
                <label>Важность</label>
                <select id="priorityInput">
                    <option value="urgent">Срочно</option>
                    <option value="important">Важно</option>
                    <option value="normal" selected>Обычное</option>
                    <option value="low">Не важно</option>
                </select>
            </div>
            <div class="form-group">
                <label>Срок</label>
                <input type="datetime-local" id="dueDateInput">
            </div>

            <div class="form-group">
                <label>Примечание</label>
                <input type="text" id="noteInput" placeholder="Статус задачи">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Файл (макс. 5 МБ)</label>
                <input type="file" id="fileInput">
            </div>
            <button class="action-btn" onclick="addTask()">+ Добавить</button>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all')">Все</button>
            <button class="filter-btn" onclick="setFilter('urgent')">Только срочные</button>
            <button class="filter-btn" onclick="setFilter('overdue')">Просроченные</button>
            <button class="filter-btn" onclick="setFilter('uncompleted')">Активные</button>
        </div>

        <!-- Прогресс -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0% выполнено</div>
        </div>

        <ul id="tasksList">
            <!-- Задачи появятся здесь -->
        </ul>
        <footer class="footer-author">
            <button onclick="changeTheme()">🎨 Сменить тему</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
