<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик задач</title>
    <!-- Современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Иконки Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="header">
        <div class="title-wrapper">
            <h1>Планировщик задач</h1>
        </div>
    </header>

    <!-- Форма добавления -->
    <form class="add-form" onsubmit="event.preventDefault(); addTask();">
        <div class="form-group full-width">
            <label for="taskInput"><i class="ph ph-text-t"></i> Задача</label>
            <input type="text" id="taskInput" placeholder="Что нужно сделать?" required>
        </div>

        <div class="form-group">
            <label for="priorityInput"><i class="ph ph-flag"></i> Важность</label>
            <select id="priorityInput">
                <option value="urgent">🔥 Срочно</option>
                <option value="important">⭐ Важно</option>
                <option value="normal" selected>📌 Обычное</option>
                <option value="low">☕ Не важно</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dueDateInput"><i class="ph ph-calendar"></i> Срок</label>
            <input type="datetime-local" id="dueDateInput">
        </div>

        <div class="form-group">
            <label for="noteInput"><i class="ph ph-note"></i> Примечание</label>
            <input type="text" id="noteInput" placeholder="Детали...">
        </div>

        <div class="form-group">
            <label for="fileInput"><i class="ph ph-paperclip"></i> Файл (до 5 МБ)</label>
            <input type="file" id="fileInput">
        </div>

        <button type="submit" class="action-btn">
            <i class="ph ph-plus-circle"></i> Добавить
        </button>
    </form>

    <!-- Фильтры -->
    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
        <button class="filter-btn" onclick="setFilter('uncompleted', this)">Активные</button>
        <button class="filter-btn" onclick="setFilter('urgent', this)">Только срочные</button>
        <button class="filter-btn" onclick="setFilter('overdue', this)">Просроченные</button>
    </div>

    <!-- Прогресс -->
    <div class="progress-container">
        <div class="progress-header">
            <span class="progress-label">Общий прогресс</span>
            <span id="progressText" class="progress-text">0% выполнено</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <!-- Список задач -->
    <ul id="tasksList" class="tasks-list">
        <!-- Задачи будут добавлены здесь через JS -->
    </ul>

    <footer class="footer-author">
    <button onclick="changeTheme()">🎨 Сменить тему</button>
  </footer>
</div>



<script src="script.js"></script>
</body>
</html>
